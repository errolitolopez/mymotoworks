<div class="modal fade" id="void-modal" tabindex="-1" aria-labelledby="void-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" id="void-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="void-modal-title">Void sale</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="void-summary" class="mb-3"></p>
        <p id="void-help" class="text-body-secondary small"></p>
        <label for="void-reason" id="void-label" class="form-label"></label>
        <input id="void-reason" type="text" class="form-control" maxlength="200" autocomplete="off" required>
        <div id="void-error" class="alert alert-danger py-2 mt-3 mb-0 d-none" role="alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary bi bi-x-lg" data-bs-dismiss="modal"> Cancel</button>
        <button id="void-button" type="submit" class="btn btn-danger bi bi-slash-circle"></button>
      </div>
    </form>
  </div>
</div>
