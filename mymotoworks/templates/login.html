{% extends "base.html" %}

{% block title %}Login · mymotoworks{% endblock %}

{% block content %}
<main class="container d-flex align-items-center justify-content-center flex-grow-1">
  <div class="card w-100" style="max-width: 380px;">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1 bi bi-wrench-adjustable"> mymotoworks</h1>
      <p class="text-center text-body-secondary mb-4">Jaryl's Motoworks</p>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input id="username" name="username" type="text" class="form-control form-control-lg"
                 autocomplete="username" autocapitalize="none" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control form-control-lg"
                 autocomplete="current-password" required>
        </div>
        <div id="login-error" class="alert alert-danger py-2 d-none" role="alert"></div>
        <button id="login-button" type="submit" class="btn btn-primary btn-lg w-100 bi bi-box-arrow-in-right"> Login</button>
      </form>
      <p class="text-center text-body-secondary small mt-3 mb-0">No account? Ask the admin to create one.</p>
    </div>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
